syntax = "proto3";

package migration;

service MigrationService {
    rpc ListNodes(Empty) returns (NodeListResponse);
    rpc MigrateContainer(MigrateRequest) returns (MigrateResponse);
    rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);
    rpc ListJobs(Empty) returns (JobListResponse);
    rpc Refresh(Empty) returns (Empty);
    rpc StartContainer(StartContainerRequest) returns (StartContainerResponse);
    rpc AddNode(AddNodeRequest) returns (AddNodeResponse);
    rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
    rpc SetNodes(SetNodesRequest) returns (SetNodesResponse);
    rpc StartInteractiveMigrate(StartInteractiveMigrateRequest) returns (StartInteractiveMigrateResponse);
    rpc PreDumpInteractive(PreDumpInteractiveRequest) returns (PreDumpInteractiveResponse);
    rpc FinalInteractiveMigrate(FinalInteractiveMigrateRequest) returns (FinalInteractiveMigrateResponse);
}

message Empty {}

message StartContainerRequest {
    string node_ip = 1;
    string pod_config_path = 2;
    string container_config_path = 3;
}

message StartContainerResponse {
    string container_id = 1;
    string pod_id = 2;
    string message = 3;
}

message ContainerInfo {
    string id = 1;
    string name = 2;
    string pod_id = 3;
    string state = 4;
    string image = 5;
}

message NodeInfo {
    string ip = 1;
    string status = 2;
    repeated ContainerInfo containers = 3;
    string error_msg = 4;
}

message NodeListResponse {
    repeated NodeInfo nodes = 1;
}

message MigrateRequest {
    string container_id = 1;
    string source_ip = 2;
    string target_ip = 3;
    int32 pre_dumps_count = 4;
}

message MigrateResponse {
    string job_id = 1;
}

message JobStatusRequest {
    string job_id = 1;
}

message JobStatusResponse {
    string job_id = 1;
    string container_id = 2;
    string source_ip = 3;
    string target_ip = 4;
    string status = 5;
    string step = 6;
    double start_time = 7;
    double end_time = 8;
    string error_msg = 9;
}

message JobListResponse {
    repeated JobStatusResponse jobs = 1;
}

message AddNodeRequest {
    string ip = 1;
}

message AddNodeResponse {
    bool success = 1;
    string message = 2;
}

message RemoveNodeRequest {
    string ip = 1;
}

message RemoveNodeResponse {
    bool success = 1;
    string message = 2;
}

message SetNodesRequest {
    repeated string ips = 1;
}

message SetNodesResponse {
    bool success = 1;
    string message = 2;
}

message StartInteractiveMigrateRequest {
    string container_id = 1;
    string source_ip = 2;
    string target_ip = 3;
    string pod_config_path = 4;
    string container_config_path = 5;
}

message StartInteractiveMigrateResponse {
    string job_id = 1;
    string message = 2;
}

message PreDumpInteractiveRequest {
    string job_id = 1;
    bool transfer = 2;
}

message PreDumpInteractiveResponse {
    string job_id = 1;
    int32 iteration = 2;
    bool transferred = 3;
    string message = 4;
}

message FinalInteractiveMigrateRequest {
    string job_id = 1;
}

message FinalInteractiveMigrateResponse {
    string job_id = 1;
    string message = 2;
}
